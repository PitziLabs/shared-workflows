# ============================================================================
# Reusable: Terraform lint (tf-lint.yml)
# ============================================================================
# Runs four quality gates over a caller-specified Terraform directory:
#
#   1. terraform fmt -check -recursive  — formatting consistency
#   2. terraform init -backend=false + terraform validate  — config validity
#      No backend means no cloud credentials; intentionally runnable on any
#      PR without secrets, including fork PRs.
#   3. tflint  — idiomatic Terraform and provider-specific rules
#   4. trivy config  — IaC misconfiguration scan
#      Trivy is chosen over checkov for consistency: it already handles
#      container scanning in site-deploy.yml, so the fleet uses one tool
#      across two surfaces rather than two separate tools.
#
# Each gate can be individually disabled via a boolean input for callers with
# a legitimate reason (e.g. a module repo whose fmt is enforced separately).
#
# REQUIRED-CHECK NOTE: If you intend to make this a required status check,
# trigger it unconditionally on pull_request — no paths: filter. A required
# check whose workflow never triggers is held "Expected" forever and deadlocks
# every non-matching PR. This is the hard fleet rule; the checker itself is
# fast and cheap when Terraform hasn't changed.
# ============================================================================

name: Terraform Lint (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing Terraform configuration, relative to the repo root"
        type: string
        default: "terraform"
      terraform_version:
        description: "Terraform version to install (e.g. '1.9.8' or 'latest')"
        type: string
        default: "latest"
      tflint_version:
        description: "tflint version to install (e.g. 'v0.54.0' or 'latest')"
        type: string
        default: "latest"
      enable_fmt:
        description: "Run terraform fmt -check -recursive"
        type: boolean
        default: true
      enable_validate:
        description: "Run terraform init -backend=false + terraform validate"
        type: boolean
        default: true
      enable_tflint:
        description: "Run tflint"
        type: boolean
        default: true
      enable_trivy:
        description: "Run trivy config (IaC misconfiguration scan)"
        type: boolean
        default: true

jobs:
  tf-lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      # ── Gate 1: formatting ───────────────────────────────────────────────
      - name: terraform fmt
        if: inputs.enable_fmt
        run: |
          echo "━━━ terraform fmt -check -recursive ━━━"
          terraform fmt -check -recursive

      # ── Gate 2: validity ─────────────────────────────────────────────────
      - name: terraform init (no backend)
        if: inputs.enable_validate
        # -backend=false skips remote state init — no cloud credentials needed.
        run: |
          echo "━━━ terraform init -backend=false ━━━"
          terraform init -backend=false

      - name: terraform validate
        if: inputs.enable_validate
        run: |
          echo "━━━ terraform validate ━━━"
          terraform validate

      # ── Gate 3: tflint ───────────────────────────────────────────────────
      - name: Setup tflint
        if: inputs.enable_tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: tflint init
        if: inputs.enable_tflint
        run: |
          echo "━━━ tflint --init ━━━"
          tflint --init

      - name: tflint
        if: inputs.enable_tflint
        run: |
          echo "━━━ tflint --recursive ━━━"
          tflint --recursive

      # ── Gate 4: Trivy IaC misconfiguration scan ──────────────────────────
      - name: Trivy config scan
        if: inputs.enable_trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.working_directory }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          hide-progress: "true"
