# ============================================================================
# OpenSSF Scorecard
# ============================================================================
# Runs the OSSF Scorecard supply-chain security analysis on a weekly schedule
# and on every push to main. Results are uploaded to GitHub's code-scanning
# dashboard (SARIF) and published to the Scorecard API so the badge reflects
# live data.
#
# This workflow is not reusable — it runs directly in this repo to assess
# shared-workflows' own security posture. A separate fleet-rollout effort
# (lentago/.github#115) will propagate an equivalent workflow to every
# Lentago Labs repo.
# ============================================================================

name: OpenSSF Scorecard

on:
  schedule:
    # Weekly on Monday at 07:23 UTC — avoids GitHub Actions peak load windows.
    - cron: "23 7 * * 1"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to the code-scanning dashboard.
      security-events: write
      # Required to publish results and generate the Scorecard badge.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
